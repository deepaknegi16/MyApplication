spring.application.name=hotel-service

# ---------- Datasource (H2 in-memory; replace with a real DB in prod profile) ----------
spring.datasource.url=jdbc:h2:mem:hoteldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Let Hibernate create the schema, then run data.sql to seed it
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Security users (demo defaults — override via env in production, e.g. APP_SECURITY_ADMIN_PASSWORD) ----------
app.security.user.name=user
app.security.user.password=user123
app.security.admin.name=admin
app.security.admin.password=admin123

# ---------- JWT (HS256; secret must be >= 32 chars — demo value, override via APP_SECURITY_JWT_SECRET in prod) ----------
app.security.jwt.secret=change-me-in-production-0123456789-abcdefghijklmnop
app.security.jwt.expiration-minutes=60

# ---------- Feature flags ----------
# Set to false to remove the scheduled stats reporter bean entirely (@ConditionalOnProperty)
app.stats.enabled=true

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=hotel-service
info.app.description=Hotel retrieval, soft-delete and city-center distance search

# ---------- OpenAPI / Swagger UI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---------- Server ----------
server.shutdown=graceful
server.error.include-stacktrace=never
