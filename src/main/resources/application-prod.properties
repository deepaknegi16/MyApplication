# Production profile: run with --spring.profiles.active=prod
# Expects a real database and credentials injected via environment variables.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never auto-create schema or reseed in production
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false

# No H2 console in production
spring.h2.console.enabled=false

# Security credentials must come from the environment — no defaults here
app.security.user.name=${APP_SECURITY_USER_NAME}
app.security.user.password=${APP_SECURITY_USER_PASSWORD}
app.security.admin.name=${APP_SECURITY_ADMIN_NAME}
app.security.admin.password=${APP_SECURITY_ADMIN_PASSWORD}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.jwt.expiration-minutes=${APP_SECURITY_JWT_EXPIRATION_MINUTES:30}

management.endpoint.health.show-details=never
